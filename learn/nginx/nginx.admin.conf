# 前端容器
upstream front_admin {
    server 127.0.0.1:7002;
}

upstream back_admin {
    server 127.0.0.1:12002;
}

upstream back_file {
    server 127.0.0.1:12004;
}

upstream back_cron {
    server 127.0.0.1:12005;
}


server {
    listen 80 default_server;
    server_name _;          # 或者写你的域名 example.com

    # === 前端静态 + history 路由 ===
    location / {
        proxy_pass http://front_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # === 后端 API ===
    location ^~ /admin/ {
        proxy_pass http://back_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /file/ {
        proxy_pass http://back_file;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;    # 下载时间
        proxy_send_timeout 300s;    # 上传时间
    }

    location ^~ /cron/ {
        proxy_pass http://back_cron;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}