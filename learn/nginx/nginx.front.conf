# 宿主机 80 端口，统一入口

upstream front_web {
    server 127.0.0.1:7001;
}

upstream back_web {
    server 127.0.0.1:12001;
}

upstream back_ws {
    server 127.0.0.1:12003;
}

upstream back_file {
    server 127.0.0.1:12004;
}

server {
    listen 80 default_server;
    server_name _;          # 或者写你的域名 example.com

    # === 前端静态 + history 路由 ===
    location / {
        proxy_pass http://front_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # === 后端 API ===
    location ^~ /web/ {
        proxy_pass http://back_web;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ^~ /file/ {
        proxy_pass http://back_file;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;    # 下载时间
        proxy_send_timeout 300s;    # 上传时间
    }

    location ^~ /ws/ {
        proxy_pass http://back_ws;     # 如果 WS 独立端口，换成对应 upstream
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}